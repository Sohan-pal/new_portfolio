<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14342B"/>
      <stop offset="100%" stop-color="#091E18"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Browser Window Wrapper -->
  <rect width="720" height="450" rx="10" fill="#EFE8D6" stroke="#111111" stroke-width="3"/>

  <!-- Window Header -->
  <rect width="720" height="38" rx="8" fill="#E2DAC4" stroke="#111111" stroke-width="2"/>
  <circle cx="22" cy="19" r="6" fill="#E9B7A0" stroke="#111111" stroke-width="1.5"/>
  <circle cx="38" cy="19" r="6" fill="#F4E295" stroke="#111111" stroke-width="1.5"/>
  <circle cx="54" cy="19" r="6" fill="#B8D8D3" stroke="#111111" stroke-width="1.5"/>
  <rect x="130" y="8" width="460" height="22" rx="5" fill="#FAF7EE" stroke="#111111" stroke-width="1.5"/>
  <text x="360" y="23" font-family="'Space Mono', monospace" font-size="11" fill="#444" text-anchor="middle">aothub.ac.in/portal/dashboard</text>

  <!-- App Content -->
  <g transform="translate(18, 50)">
    <!-- Main Banner Canvas -->
    <rect width="684" height="380" rx="8" fill="url(#bgGrad)"/>
    
    <!-- Header Art / Circuit Pattern -->
    <path d="M 0 0 L 684 0 L 684 120 L 0 120 Z" fill="#1D4336"/>
    <path d="M 40 40 L 120 40 L 140 70 L 260 70" stroke="#378768" stroke-width="2" fill="none"/>
    <circle cx="260" cy="70" r="4" fill="#6EE7B7"/>
    <path d="M 300 20 L 340 50 L 440 50" stroke="#378768" stroke-width="2" fill="none"/>
    <circle cx="440" cy="50" r="4" fill="#F59E0B"/>
    <circle cx="340" cy="50" r="3" fill="#6EE7B7"/>

    <!-- Hero Card inside App -->
    <g transform="translate(40, 60)" filter="url(#shadow)">
      <rect width="604" height="280" rx="10" fill="#FAF7EE" stroke="#111" stroke-width="2"/>
      
      <!-- Badge -->
      <rect x="30" y="28" width="130" height="24" rx="12" fill="#E9B7A0" stroke="#111" stroke-width="1.5"/>
      <text x="95" y="44" font-family="'Space Mono', monospace" font-size="11" font-weight="bold" fill="#111" text-anchor="middle">CAMPUS HUB</text>
      
      <!-- Headline -->
      <text x="30" y="90" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="bold" fill="#111">AOThub Web App Platform</text>
      <text x="30" y="118" font-family="'Space Grotesk', sans-serif" font-size="14" fill="#555">All-in-one portal for event notices, coding clubs, and real-time student stats.</text>
      
      <!-- Buttons -->
      <rect x="30" y="145" width="140" height="38" rx="6" fill="#111"/>
      <text x="100" y="169" font-family="'Space Mono', monospace" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">Explore Portal</text>
      
      <rect x="185" y="145" width="120" height="38" rx="6" fill="#B8D8D3" stroke="#111" stroke-width="1.5"/>
      <text x="245" y="169" font-family="'Space Mono', monospace" font-size="13" font-weight="bold" fill="#111" text-anchor="middle">Notices</text>
      
      <!-- Stats mini cards -->
      <g transform="translate(30, 205)">
        <rect width="165" height="52" rx="6" fill="#F4EEDB" stroke="#111" stroke-width="1.5"/>
        <text x="15" y="25" font-family="'Space Mono', monospace" font-size="11" fill="#666">ACTIVE STUDENTS</text>
        <text x="15" y="44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#111">2,480+</text>

        <rect x="185" width="165" height="52" rx="6" fill="#F4EEDB" stroke="#111" stroke-width="1.5"/>
        <text x="200" y="25" font-family="'Space Mono', monospace" font-size="11" fill="#666">EVENTS HOSTED</text>
        <text x="200" y="44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#111">128</text>

        <rect x="370" width="170" height="52" rx="6" fill="#F4EEDB" stroke="#111" stroke-width="1.5"/>
        <text x="385" y="25" font-family="'Space Mono', monospace" font-size="11" fill="#666">CLUBS ONBOARDED</text>
        <text x="385" y="44" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#111">14 Depts</text>
      </g>
    </g>
  </g>
</svg>
